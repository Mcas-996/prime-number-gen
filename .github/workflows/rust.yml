name: Rust

on:
  push:
    #branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keep tests on a standard Linux host
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --verbose

  # Build native binaries for Windows, macOS, Linux x86_64
  build-matrix:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_target: true
            artifact_name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_target: true
            artifact_name: windows-x86_64
          - os: macos-latest
            target: ""
            use_target: false
            artifact_name: macos
    steps:
      - uses: actions/checkout@v4

      # Add toolchain + target only when cross-targeting
      - if: ${{ matrix.use_target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Build with explicit --target when specified
      - name: Build (release, explicit target)
        if: ${{ matrix.use_target }}
        run: cargo build --verbose --release --target ${{ matrix.target }}

      # Build natively (macOS case above)
      - name: Build (release, native)
        if: ${{ !matrix.use_target }}
        run: cargo build --verbose --release

      # Upload artifacts for explicit target builds
      - name: Upload artifact (targeted)
        if: ${{ matrix.use_target }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/

      # Upload artifacts for native build (macOS)
      - name: Upload artifact (native)
        if: ${{ !matrix.use_target }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/

  # Build Linux aarch64 using an ARM64 container
  build-linux-arm64:
    name: Build linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in AArch64 container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y curl build-essential pkg-config libssl-dev ca-certificates
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            rustc -V
            cargo -V
            cargo build --verbose --release -j 1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: target/release/
