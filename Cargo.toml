[package]
name = "prime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "prime-cli"
path = "src/main.rs"

[[bin]]
name = "prime-gui"
path = "src/gui_main.rs"

[dependencies]
rand = "0.8"
rayon = "1.5"
eframe = "0.27.2"
egui = "0.27.2"
egui_extras = "0.27.2"
serde = { version = "1.0", features = ["derive"] }
