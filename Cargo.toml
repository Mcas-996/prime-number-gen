[package]
name = "prime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A high-performance prime number calculator using linear sieve algorithm"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/prime-calculator"
keywords = ["prime", "mathematics", "algorithm", "sieve", "number-theory"]
categories = ["algorithms", "mathematics", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "prime-cli"
path = "src/main.rs"

[[bin]]
name = "prime-gui"
path = "src/gui_main.rs"

[dependencies]
rand = "0.8"
rayon = "1.5"
eframe = "0.27.2"
egui = "0.27.2"
egui_extras = "0.27.2"
serde = { version = "1.0", features = ["derive"] }
